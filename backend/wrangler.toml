name = "quizify-backend"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "QUIZZES"
id = "your-quizzes-kv-id"

[[kv_namespaces]]
binding = "USERS"
id = "your-users-kv-id"

[vars]
YOUTUBE_API_KEY = "@youtube_api_key"
GEMINI_API_KEY = "@gemini_api_key"
GUMROAD_API_KEY = "@gumroad_api_key"