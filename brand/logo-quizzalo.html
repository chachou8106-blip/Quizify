<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<style>
  body{margin:0;background:#0E0A26;color:#fff;font-family:system-ui,sans-serif;padding:36px 40px}
  h1{font-size:26px;margin:0 0 4px;background:linear-gradient(90deg,#A78BFA,#EC4899);-webkit-background-clip:text;color:transparent}
  p.sub{color:#8b85a8;margin:0 0 30px;font-size:13px}
  h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#A78BFA;margin:28px 0 12px}
  .row{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .cell{text-align:center}
  .cell em{display:block;font-size:10px;color:#8b85a8;margin-top:6px;font-style:normal}
  .light{background:#FFF9F0;padding:14px;border-radius:14px}
  .swatch{width:64px;height:64px;border-radius:12px}
  .sw{text-align:center;font-size:10px;color:#8b85a8}
</style></head><body>
<h1>Quizzalo — identité</h1>
<p class="sub">La fête commence par une question</p>
<div id="out"></div>
<script>
const marque=(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64">
 <defs><linearGradient id="b${s}" x1="0.05" y1="0" x2="0.95" y2="1">
 <stop offset="0" stop-color="#A78BFA"/><stop offset="0.45" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient>
 <radialGradient id="e${s}" cx="0.3" cy="0.22" r="0.6"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
 <path d="M31 6C16 6 4 15.9 4 28.1c0 7 4 13.4 10.3 17.4l-1.6 9.9c-.25 1.6 1.5 2.75 2.85 1.85l9.9-6.6c1.8.3 3.65.45 5.55.45 15 0 27-9.9 27-22.1S46 6 31 6z" fill="url(#b${s})"/>
 <path d="M31 6C16 6 4 15.9 4 28.1c0 7 4 13.4 10.3 17.4l-1.6 9.9c-.25 1.6 1.5 2.75 2.85 1.85l9.9-6.6c1.8.3 3.65.45 5.55.45 15 0 27-9.9 27-22.1S46 6 31 6z" fill="url(#e${s})"/>
 <path d="M24.8 23.9c0-3.7 3-6.7 6.8-6.7s6.8 2.8 6.8 6.4c0 2.8-1.6 4.3-3.8 5.9-2 1.4-2.7 2.3-2.7 4.2v1" fill="none" stroke="#fff" stroke-width="4.8" stroke-linecap="round"/>
 <circle cx="31.2" cy="42.4" r="3" fill="#fff"/>
 <path d="M52 7l1.85 3.75 4.15.6-3 2.9.7 4.1L52 16.4l-3.7 1.95.7-4.1-3-2.9 4.15-.6z" fill="#FBBF24"/></svg>`;
const pastille=(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64">
 <defs><linearGradient id="t${s}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient>
 <linearGradient id="p${s}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#DB2777"/></linearGradient></defs>
 <rect width="64" height="64" rx="15" fill="url(#t${s})"/>
 <path d="M32 13c-10.5 0-19 6.9-19 15.4 0 4.9 2.8 9.3 7.2 12.1l-1.1 6.9c-.2 1.2 1.1 2 2.1 1.3l6.9-4.6c1.3.2 2.6.3 3.9.3 10.5 0 19-6.9 19-15.4S42.5 13 32 13z" fill="#fff"/>
 <path d="M27.6 26.2c0-2.6 2.1-4.6 4.7-4.6s4.7 1.9 4.7 4.4c0 1.9-1.1 3-2.6 4.1-1.4 1-1.9 1.6-1.9 2.9v.7" fill="none" stroke="url(#p${s})" stroke-width="3.4" stroke-linecap="round"/>
 <circle cx="32.1" cy="38.2" r="2.1" fill="url(#p${s})"/></svg>`;
let h='';
h+='<h2>La marque — fond transparent, pour le site</h2><div class="row">';
for(const s of [140,72,44,28,20,16]) h+=`<div class="cell">${marque(s)}<em>${s} px</em></div>`;
h+=`<div class="cell light">${marque(56)}<em style="color:#666">sur clair</em></div></div>`;
h+='<h2>La pastille — onglet du navigateur, écran d\'accueil</h2><div class="row">';
for(const s of [140,72,44,28,20,16]) h+=`<div class="cell">${pastille(s)}<em>${s} px</em></div>`;
h+=`<div class="cell light">${pastille(56)}<em style="color:#666">sur clair</em></div></div>`;
h+='<h2>Verrouillage avec le nom</h2><div class="row">';
for(const s of [56,38,26]) h+=`<div class="cell" style="display:flex;align-items:center;gap:10px">${marque(s)}
 <span style="font-size:${s*0.72}px;font-weight:800;background:linear-gradient(90deg,#8B5CF6,#EC4899);-webkit-background-clip:text;color:transparent">Quizzalo</span></div>`;
h+='</div>';
h+='<h2>Couleurs</h2><div class="row">';
for(const [c,n] of [['#A78BFA','Violet clair'],['#8B5CF6','Violet'],['#EC4899','Rose'],['#FBBF24','Or'],['#0E0A26','Nuit']])
 h+=`<div class="sw"><div class="swatch" style="background:${c};${c==='#0E0A26'?'border:1px solid #2a2450':''}"></div>${n}<br>${c}</div>`;
h+='</div>';
document.getElementById('out').innerHTML=h;
</script></body></html>
