<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quizzalo">
  <!-- Pastille d'application : la même bulle, mais posée sur une tuile pleine.
       C'est la version à utiliser partout où l'icône a besoin de son propre fond
       (onglet du navigateur, écran d'accueil du téléphone), car une marque
       transparente disparaît sur les surfaces sombres. -->
  <defs>
    <linearGradient id="qzTuile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="qzPoint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#qzTuile)"/>
  <path d="M32 13c-10.5 0-19 6.9-19 15.4 0 4.9 2.8 9.3 7.2 12.1l-1.1 6.9c-.2 1.2 1.1 2 2.1 1.3l6.9-4.6c1.3.2 2.6.3 3.9.3 10.5 0 19-6.9 19-15.4S42.5 13 32 13z" fill="#FFFFFF"/>
  <path d="M27.6 26.2c0-2.6 2.1-4.6 4.7-4.6s4.7 1.9 4.7 4.4c0 1.9-1.1 3-2.6 4.1-1.4 1-1.9 1.6-1.9 2.9v.7" fill="none" stroke="url(#qzPoint)" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="32.1" cy="38.2" r="2.1" fill="url(#qzPoint)"/>
</svg>
